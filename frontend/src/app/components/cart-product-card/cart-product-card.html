<div
  class="group bg-card shadow-sm p-4 sm:p-6 border border-slate-800 hover:border-primary/30 rounded-xl transition-all duration-300"
>
  <div class="flex sm:flex-row flex-col gap-6">
    <div class="relative bg-slate-800 rounded-lg w-full sm:w-32 h-40 overflow-hidden shrink-0">
      <img
        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
        [src]="getVariantImage()"
        alt="Neon Cyberpunk Jacket - AI V2"
      />
      <div
        class="top-2 left-2 absolute flex items-center gap-1 bg-black/60 backdrop-blur-sm px-1.5 py-0.5 border border-white/10 rounded"
      >
        <span class="text-[10px] text-primary">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-sparkles-icon lucide-sparkles"
          >
            <path
              d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"
            />
            <path d="M20 2v4" />
            <path d="M22 4h-4" />
            <circle cx="4" cy="20" r="2" />
          </svg>
        </span>
        <span class="font-semibold text-[10px] text-white uppercase tracking-wider">AI Gen</span>
      </div>
    </div>
    <div class="flex flex-col flex-1 justify-between">
      <div>
        <div class="flex justify-between items-start">
          <h3 class="font-bold text-white text-lg">{{ item().product.name }}</h3>
          <p class="font-bold text-white text-lg">{{ item().price | currency }}</p>
        </div>
        <p class="mt-1 text-slate-400 text-sm italic">
          Generated Prompt: "Neon lights, rain, dystopian city vibes"
        </p>
        <div class="flex flex-wrap gap-4 mt-4 text-sm">
          <div class="flex items-center gap-2">
            <span class="text-slate-400">Size:</span>
            <span class="font-medium text-white">{{ item().size }}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-slate-400">Color:</span>
            <span class="font-medium text-white">{{ getVariantColor() }}</span>
          </div>
        </div>
      </div>
      <div class="flex justify-between items-center mt-6 pt-4 border-slate-800 border-t">
        <div class="flex items-center border border-slate-700 rounded-lg">
          <button
            (click)="handleMinus()"
            class="hover:bg-slate-700 p-1 rounded-l-lg text-slate-400 transition-colors duration-300 cursor-pointer"
          >
            <span class="text-sm">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-minus-icon lucide-minus"
              >
                <path d="M5 12h14" />
              </svg>
            </span>
          </button>
          <input
            type="text"
            class="bg-transparent p-0 border-0 focus:ring-0 w-8 font-medium text-white text-sm text-center"
            [value]="item().quantity"
            disabled
          />
          <button
            (click)="handlePlus()"
            class="hover:bg-slate-700 p-1 rounded-r-lg text-slate-400 transition-colors duration-300 cursor-pointer"
          >
            <span class="text-sm">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-plus-icon lucide-plus"
              >
                <path d="M5 12h14" />
                <path d="M12 5v14" />
              </svg>
            </span>
          </button>
        </div>
        <div class="flex gap-4">
          <button
          (click)="handleRemove()"
            class="flex items-center gap-1 text-slate-500 hover:text-red-400 text-sm transition-colors duration-300 cursor-pointer"
          >
            <span class="text-base">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-trash2-icon lucide-trash-2"
              >
                <path d="M10 11v6" />
                <path d="M14 11v6" />
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                <path d="M3 6h18" />
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
              </svg>
            </span>
            <span class="hidden sm:inline">Remove</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
