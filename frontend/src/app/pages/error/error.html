<main
  class="z-10 relative flex flex-col justify-center items-center px-6 pt-28 pb-12 text-center grow"
>
  <div class="group relative mb-8">
    <div
      class="absolute -inset-4 bg-primary/20 opacity-50 group-hover:opacity-100 blur-3xl rounded-full transition-opacity"
    ></div>
    <div class="relative flex justify-center items-center w-72 md:w-96 h-72 md:h-96">
      <div
        class="relative shadow-2xl border border-white/10 rounded-2xl w-full h-full overflow-hidden"
      >
        <img
          alt="Glitched Digital Fashion"
          class="opacity-80 w-full h-full object-cover mix-blend-lighten"
          data-alt="Futuristic digital holographic puffer jacket with glitch effects"
          src="/images/AIWoman.png"
        />
        <div class="absolute inset-0 bg-linear-to-t from-background-dark/80 to-transparent"></div>
        <div class="top-4 left-4 absolute flex gap-1">
          <div class="bg-primary w-8 h-1"></div>
          <div class="bg-primary/50 w-2 h-1"></div>
        </div>
      </div>
      <div class="-top-10 -right-10 md:-right-20 absolute">
        <span
          class="opacity-20 stroke-current border-text font-extrabold text-[120px] text-transparent md:text-[180px] leading-none select-none glitch-text"
          style="-webkit-text-stroke: 2px currentColor"
        >
          404
        </span>
      </div>
    </div>
  </div>
  <div class="max-w-2xl">
    <h2 class="mb-4 font-extrabold text-4xl md:text-6xl italic uppercase tracking-tight">
      Lost in the Studio<span class="text-primary">.</span>
    </h2>
    <p class="mx-auto mb-10 max-w-lg font-light text-slate-400 text-lg md:text-xl leading-relaxed">
      Oops! This style doesn't exist yet. The look you're searching for hasn't been rendered. Let's
      get you back to the runway.
    </p>
  </div>
  <div class="flex sm:flex-row flex-col justify-center items-center gap-4 px-4 w-full max-w-md">
    <a
      class="flex justify-center items-center gap-2 bg-primary shadow-lg shadow-primary/25 hover:brightness-110 px-8 py-4 rounded-lg w-full sm:w-auto min-w-45 font-bold text-white hover:scale-[1.02] transition-all duration-300"
      routerLink="/home"
    >
      <span class="flex justify-center items-center">
        <ng-icon size="20" name="lucideHouse"></ng-icon>
      </span>
      Return Home
    </a>
    <a
      class="flex justify-center items-center gap-2 bg-slate-800 hover:bg-slate-700 px-8 py-4 border border-slate-700 rounded-lg w-full sm:w-auto min-w-45 font-bold text-white transition-all duration-300"
      routerLink="/products"
    >
      <span class="flex justify-center items-center">
        <ng-icon size="20" name="lucideHandbag"></ng-icon>
      </span>
      Browse Shop
    </a>
  </div>
</main>
