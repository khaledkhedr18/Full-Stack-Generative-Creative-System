<main
  class="relative z-10 grow flex flex-col items-center justify-center px-6 pt-28 pb-12 text-center"
>
  <div class="relative mb-8 group">
    <div
      class="absolute -inset-4 bg-primary/20 blur-3xl rounded-full opacity-50 group-hover:opacity-100 transition-opacity"
    ></div>
    <div class="relative w-72 h-72 md:w-96 md:h-96 flex items-center justify-center">
      <div
        class="relative w-full h-full rounded-2xl overflow-hidden border border-white/10 shadow-2xl"
      >
        <img
          alt="Glitched Digital Fashion"
          class="w-full h-full object-cover opacity-80 mix-blend-lighten"
          data-alt="Futuristic digital holographic puffer jacket with glitch effects"
          src="/images/AIWoman.png"
        />
        <div class="absolute inset-0 bg-linear-to-t from-background-dark/80 to-transparent"></div>
        <div class="absolute top-4 left-4 flex gap-1">
          <div class="h-1 w-8 bg-primary"></div>
          <div class="h-1 w-2 bg-primary/50"></div>
        </div>
      </div>
      <div class="absolute -top-10 -right-10 md:-right-20">
        <span
          class="text-[120px] md:text-[180px] font-extrabold leading-none select-none text-transparent border-text stroke-current opacity-10 dark:opacity-20 glitch-text"
          style="-webkit-text-stroke: 2px currentColor"
        >
          404
        </span>
      </div>
    </div>
  </div>
  <div class="max-w-2xl">
    <h2 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-4 uppercase italic">
      Lost in the Studio<span class="text-primary">.</span>
    </h2>
    <p
      class="text-slate-500 dark:text-slate-400 text-lg md:text-xl font-light mb-10 max-w-lg mx-auto leading-relaxed"
    >
      Oops! This style doesn't exist yet. The look you're searching for hasn't been rendered. Let's
      get you back to the runway.
    </p>
  </div>
  <div class="flex flex-col sm:flex-row items-center justify-center gap-4 w-full max-w-md px-4">
    <a
      class="w-full sm:w-auto min-w-45 flex items-center justify-center gap-2 px-8 py-4 bg-primary text-white rounded-lg font-bold hover:brightness-110 hover:scale-[1.02] transition-all shadow-lg shadow-primary/25"
      routerLink="/home"
    >
      <fa-icon [icon]="faHouse"></fa-icon>
      Return Home
    </a>
    <a
      class="w-full sm:w-auto min-w-45 flex items-center justify-center gap-2 px-8 py-4 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white rounded-lg font-bold hover:bg-slate-200 dark:hover:bg-slate-700 transition-all"
      routerLink="/shop"
    >
      <fa-icon [icon]="faBagShopping"></fa-icon>
      Browse Shop
    </a>
  </div>
</main>
