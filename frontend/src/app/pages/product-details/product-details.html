<div class="flex flex-col md:flex-row py-16 md:pb-0">
  <div class="relative bg-card md:px-20 md:py-40 lg:w-2/3 xl:py-20 xl:px-10">
    <div
      #imageWrapper
      (mousemove)="onMouseMove($event)"
      (mouseleave)="onMouseLeave()"
      class="w-full xl:w-1/2 xl:m-auto relative overflow-hidden rounded-lg cursor-zoom-in"
    >
      <img
        src="/images/hoodie.png"
        alt=""
        class="w-full transition-transform duration-150 ease-out will-change-transform"
        [style.transformOrigin]="zoomOrigin"
        [ngClass]="isZoomed ? 'scale-[2]' : 'scale-100'"
      />
    </div>
    <div class="absolute bottom-5 md:left-0 flex justify-center w-full pointer-events-none">
      <div class="flex gap-1 bg-background/90 rounded-3xl p-1.5 pb-2 pointer-events-auto">
        <div>
          <input id="front" type="radio" name="view" class="peer sr-only" checked />
          <label for="front" class="product-view">Front</label>
        </div>
        <div>
          <input id="back" type="radio" name="view" class="peer sr-only" />
          <label for="back" class="product-view">Back</label>
        </div>
        <div>
          <input id="side" type="radio" name="view" class="peer sr-only" />
          <label for="side" class="product-view">Side</label>
        </div>
      </div>
    </div>
  </div>
  <div class="bg-background grow flex flex-col">
    <div class="flex flex-col px-4.5 pt-4 pb-6 gap-4 border-b border-border">
      <div class="flex flex-col gap-1">
        <div class="flex justify-between font-bold md:flex-col lg:flex-row">
          <h1>Essential Heavyweight Hoodie</h1>
          <h2>$89.00</h2>
        </div>
        <span class="text-xs text-text-muted">Ref. AI-8824-Custom</span>
      </div>
      <div class="flex gap-2">
        <div class="rating rating-xs pointer-events-none">
          <input type="radio" class="mask mask-star-2 bg-orange-400" />
          <input type="radio" class="mask mask-star-2 bg-orange-400" />
          <input type="radio" class="mask mask-star-2 bg-orange-400" />
          <input type="radio" class="mask mask-star-2 bg-orange-400" checked="checked" />
          <input type="radio" class="mask mask-star-2 bg-orange-400" />
        </div>
        <p class="text-text-muted text-xs">(420 reviews)</p>
      </div>
    </div>
    <form class="flex flex-col px-4.5 py-5 gap-2">
      <div class="flex items-center gap-1.5">
        <svg viewBox="0 0 1.4 1.4" xmlns="http://www.w3.org/2000/svg" class="text-primary size-4">
          <path
            fill="currentColor"
            d="M0.667 0.317c0.007 0 0.011 -0.004 0.012 -0.011 0.018 -0.098 0.017 -0.1 0.119 -0.12 0.007 -0.001 0.011 -0.005 0.011 -0.012 0 -0.007 -0.004 -0.011 -0.011 -0.012 -0.101 -0.021 -0.098 -0.023 -0.119 -0.12 -0.002 -0.006 -0.005 -0.011 -0.012 -0.011s-0.011 0.004 -0.012 0.011c-0.021 0.097 -0.017 0.099 -0.119 0.12 -0.006 0.001 -0.011 0.005 -0.011 0.012 0 0.007 0.005 0.011 0.011 0.012 0.102 0.021 0.101 0.022 0.119 0.12 0.002 0.006 0.005 0.011 0.012 0.011M0.384 0.72c0.011 0 0.019 -0.007 0.02 -0.018 0.021 -0.156 0.026 -0.156 0.188 -0.188 0.011 -0.002 0.018 -0.009 0.018 -0.02 0 -0.011 -0.008 -0.018 -0.018 -0.02 -0.162 -0.022 -0.168 -0.028 -0.188 -0.187 -0.001 -0.011 -0.009 -0.018 -0.02 -0.018 -0.011 0 -0.018 0.008 -0.019 0.019 -0.019 0.157 -0.028 0.156 -0.188 0.186 -0.011 0.002 -0.018 0.009 -0.018 0.02 0 0.012 0.008 0.018 0.021 0.02 0.159 0.026 0.166 0.03 0.186 0.186 0.001 0.012 0.009 0.019 0.019 0.019m0.397 0.649c0.015 0 0.026 -0.011 0.029 -0.027 0.042 -0.321 0.087 -0.37 0.404 -0.405 0.016 -0.002 0.028 -0.014 0.028 -0.029s-0.011 -0.027 -0.028 -0.029c-0.318 -0.035 -0.363 -0.084 -0.404 -0.405 -0.003 -0.016 -0.014 -0.026 -0.029 -0.026s-0.026 0.011 -0.029 0.026c-0.042 0.321 -0.087 0.37 -0.404 0.405 -0.017 0.002 -0.028 0.014 -0.028 0.029 0 0.015 0.011 0.028 0.028 0.029 0.316 0.042 0.36 0.084 0.404 0.405 0.002 0.016 0.013 0.027 0.029 0.027"
          />
        </svg>
        <p class="text-xs text-text-muted">Describe your design</p>
      </div>
      <div class="flex flex-col gap-6">
        <textarea
          name=""
          id=""
          class="border border-border w-full rounded-lg bg-card text-xs p-3 text-text-muted focus:outline-none"
          placeholder="A cyberpunk city skyline with neon pink and blue lights, realistic style..."
          rows="3"
        ></textarea>
        <div class="flex flex-col gap-4.5">
          <div class="flex flex-col gap-2.5">
            <label class="text-text-muted text-xs">ART STYLE</label>
            <div class="flex gap-2 flex-wrap">
              <div>
                <input id="realistic" type="radio" name="art-style" class="peer sr-only" checked />
                <label for="realistic" class="art-style">Realistic</label>
              </div>
              <div>
                <input id="cyberpunk" type="radio" name="art-style" class="peer sr-only" />
                <label for="cyberpunk" class="art-style">Cyberpunk</label>
              </div>
              <div>
                <input id="oilPainting" type="radio" name="art-style" class="peer sr-only" />
                <label for="oilPainting" class="art-style">Oil Painting</label>
              </div>
              <div>
                <input id="minimalist" type="radio" name="art-style" class="peer sr-only" />
                <label for="minimalist" class="art-style">Minimalist</label>
              </div>
              <div>
                <input id="sketch" type="radio" name="art-style" class="peer sr-only" />
                <label for="sketch" class="art-style">Sketch</label>
              </div>
            </div>
          </div>
          <button class="btn-primary shadow-primary-glow">
            <fa-icon [icon]="faWandMagicSparkles"></fa-icon><span>Generate Artwork</span>
          </button>
        </div>
      </div>
      <hr class="border-border mt-3" />
    </form>
    <form class="px-4.5 flex flex-col gap-3.5">
      <div class="flex flex-col gap-2">
        <label class="text-xs text-text-muted">BASE COLOR</label>
        <div class="flex flex-wrap gap-2.5">
          <input type="radio" name="color" class="color-checkbox bg-white" />
          <input type="radio" name="color" class="color-checkbox bg-black" />
          <input type="radio" name="color" class="color-checkbox bg-blue-900" />
          <input type="radio" name="color" class="color-checkbox bg-gray-400" />
        </div>
      </div>
      <div class="flex flex-col gap-2">
        <div class="flex justify-between">
          <label class="text-xs text-text-muted">SIZE</label>
          <button type="button" class="text-primary text-xs cursor-pointer">Size Guide</button>
        </div>
        <div class="grid grid-cols-5 gap-1">
          <label class="cursor-pointer group">
            <input type="radio" class="peer sr-only" name="size" />
            <div
              class="text-center text-xs rounded-md py-1.5 transition-all duration-200 border-2 border-border bg-transparent text-text-muted group-hover:border-slate-600 peer-checked:bg-primary peer-checked:text-white peer-checked:border-transparent peer-checked:shadow-primary-glow"
            >
              XS
            </div>
          </label>
          <label class="cursor-pointer group">
            <input type="radio" class="peer sr-only" name="size" />
            <div
              class="text-center text-xs rounded-md py-1.5 transition-all duration-200 border-2 border-border bg-transparent text-text-muted group-hover:border-slate-600 peer-checked:bg-primary peer-checked:text-white peer-checked:border-transparent peer-checked:shadow-primary-glow"
            >
              S
            </div>
          </label>
          <label class="cursor-pointer group">
            <input type="radio" class="peer sr-only" name="size" />
            <div
              class="text-center text-xs rounded-md py-1.5 transition-all duration-200 border-2 border-border bg-transparent text-text-muted group-hover:border-slate-600 peer-checked:bg-primary peer-checked:text-white peer-checked:border-transparent peer-checked:shadow-primary-glow"
            >
              M
            </div>
          </label>
          <label class="cursor-pointer group">
            <input type="radio" class="peer sr-only" name="size" />
            <div
              class="text-center text-xs rounded-md py-1.5 transition-all duration-200 border-2 border-border bg-transparent text-text-muted group-hover:border-slate-600 peer-checked:bg-primary peer-checked:text-white peer-checked:border-transparent peer-checked:shadow-primary-glow"
            >
              L
            </div>
          </label>
          <label class="cursor-pointer group">
            <input type="radio" class="peer sr-only" name="size" />
            <div
              class="text-center text-xs rounded-md py-1.5 transition-all duration-200 border-2 border-border bg-transparent text-text-muted group-hover:border-slate-600 peer-checked:bg-primary peer-checked:text-white peer-checked:border-transparent peer-checked:shadow-primary-glow"
            >
              XL
            </div>
          </label>
        </div>
      </div>
      <div
        class="fixed bottom-0 md:static flex flex-col bg-background/50 w-full left-0 p-4 md:px-0 gap-3 backdrop-blur-xs"
      >
        <div class="flex gap-3">
          <button
            type="submit"
            class="btn-primary bg-white text-black grow hover:bg-primary hover:text-white"
          >
            <span>Add to Cart</span><fa-icon [icon]="faArrowRight"></fa-icon>
          </button>
          <button
            class="border-2 w-fit border-border px-4 py-2.5 rounded-xl bg-transparent cursor-pointer hover:border-slate-600 transition-all"
          >
            <fa-icon [icon]="faHeart" class="text-text-muted"></fa-icon>
          </button>
        </div>
        <p class="text-xs text-center text-text-muted">
          <fa-icon [icon]="faTruck"></fa-icon><span>Free shipping on orders over $150</span>
        </p>
      </div>
    </form>
  </div>
</div>
