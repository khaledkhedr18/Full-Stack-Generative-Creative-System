<ng-template #filterContent>
  <div class="flex flex-col gap-3">
    <h2 class="font-bold">Categories</h2>
    <div class="flex flex-col gap-2.5">
      <app-category-filter
        inputId="allApparel"
        label="All Apparel"
        length="124"
      ></app-category-filter>
      <app-category-filter inputId="tshirts" label="T-Shirts" length="48"></app-category-filter>
      <app-category-filter inputId="hoodies" label="Hoodies" length="32"></app-category-filter>
      <app-category-filter
        inputId="sweatshirts"
        label="Sweatshirts"
        length="24"
      ></app-category-filter>
    </div>
  </div>
  <div class="flex flex-col gap-5">
    <h2 class="font-bold">Price Range</h2>
    <div class="px-1 flex flex-col gap-2">
      <input
        type="range"
        min="0"
        value="85"
        max="200"
        class="w-full appearance-none bg-transparent cursor-pointer [&::-webkit-slider-runnable-track]:h-2 [&::-webkit-slider-runnable-track]:rounded-full [&::-webkit-slider-runnable-track]:bg-card [&::-moz-range-track]:h-2 [&::-moz-range-track]:rounded-full [&::-moz-range-track]:bg-card [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:-mt-1 [&::-webkit-slider-thumb]:h-4 [&::-webkit-slider-thumb]:w-4 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-primary [&::-moz-range-thumb]:h-4 [&::-moz-range-thumb]:w-4 [&::-moz-range-thumb]:rounded-full [&::-moz-range-thumb]:bg-primary"
      />
      <div class="flex justify-between text-xs text-text-muted">
        <span>$0</span>
        <span>$85</span>
        <span>$200+</span>
      </div>
    </div>
  </div>
  <div class="flex flex-col gap-3">
    <h2 class="font-bold">Color</h2>
    <div class="grid grid-cols-5 md:grid-cols-4 lg:grid-cols-5 gap-y-3 gap-x-6">
      <app-color-filter color="bg-black" type="checkbox"></app-color-filter>
      <app-color-filter color="bg-white" type="checkbox"></app-color-filter>
      <app-color-filter color="bg-primary" type="checkbox"></app-color-filter>
      <app-color-filter color="bg-red-500" type="checkbox"></app-color-filter>
      <app-color-filter color="bg-green-700" type="checkbox"></app-color-filter>
      <app-color-filter color="bg-yellow-400" type="checkbox"></app-color-filter>
      <app-color-filter color="bg-gray-500" type="checkbox"></app-color-filter>
    </div>
  </div>
  <div class="flex flex-col gap-3">
    <h2 class="font-bold">Size</h2>
    <div class="grid grid-cols-5 md:grid-cols-4 lg:grid-cols-5 gap-2">
      <app-size-filter size="XS"></app-size-filter>
      <app-size-filter size="S"></app-size-filter>
      <app-size-filter size="M"></app-size-filter>
      <app-size-filter size="L"></app-size-filter>
      <app-size-filter size="XL"></app-size-filter>
      <app-size-filter size="XXL"></app-size-filter>
    </div>
  </div>
  <div
    class="flex flex-col gap-2 p-4 rounded-xl bg-linear-to-br from-primary/20 to-transparent border border-primary/20"
  >
    <h1 class="font-bold flex items-center gap-2">
      <fa-icon [icon]="faWandMagicSparkles" class="text-primary"></fa-icon
      ><span>AI Design Studio</span>
    </h1>
    <div class="flex flex-col gap-3">
      <p class="text-text-muted text-xs">Create unique patterns using our generative AI engine.</p>
      <app-button type="primary">Try it now</app-button>
    </div>
  </div>
</ng-template>
<div class="grid grid-cols-1 md:grid-cols-12 py-20 px-3 md:px-6 gap-9">
  <aside class="hidden md:flex flex-col md:col-span-3 xl:col-span-2 gap-5">
    <ng-container *ngTemplateOutlet="filterContent"></ng-container>
  </aside>
  <div class="md:col-span-9 xl:col-span-10">
    <div class="flex flex-col gap-5">
      <div class="flex flex-wrap justify-between items-center gap-5">
        <h1 class="font-bold">
          All Apparel <span class="text-xs font-normal text-text-muted">(124 items)</span>
        </h1>
        <div class="flex items-center gap-3">
          <button
            class="text-text-muted text-xs flex items-center gap-1 md:hidden"
            (click)="filterModal.showModal()"
          >
            <fa-icon [icon]="faFilter"></fa-icon>
            <span>Filters</span>
          </button>
          <select
            class="text-xs border border-border bg-card py-2 pl-2 pr-1.5 rounded-lg cursor-pointer"
          >
            <option value="" selected>Sort by: Recommended</option>
            <option value="">Price</option>
            <option value="">Latest</option>
          </select>
        </div>
      </div>
      <div
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-4"
      >
        <app-product-card></app-product-card>
        <app-product-card></app-product-card>
        <app-product-card></app-product-card>
      </div>
    </div>
  </div>
</div>
<dialog #filterModal class="modal modal-bottom sm:modal-middle">
  <div class="modal-box">
    <div class="flex justify-between items-center mb-5">
      <h3 class="font-bold text-lg">Filters</h3>
      <form method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost">✕</button>
      </form>
    </div>
    <div class="flex flex-col gap-5 pb-6">
      <ng-container *ngTemplateOutlet="filterContent"></ng-container>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>Close</button>
  </form>
</dialog>
