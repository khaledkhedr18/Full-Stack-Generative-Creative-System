<ng-template #filterContent>
  <div class="flex flex-col gap-3">
    <h2 class="font-bold">Categories</h2>
    <div class="flex flex-col gap-2.5">
      <app-category-filter
        inputId="allApparel"
        label="All Apparel"
        length="124"
      ></app-category-filter>
      <app-category-filter inputId="tshirts" label="T-Shirts" length="48"></app-category-filter>
      <app-category-filter inputId="hoodies" label="Hoodies" length="32"></app-category-filter>
      <app-category-filter
        inputId="sweatshirts"
        label="Sweatshirts"
        length="24"
      ></app-category-filter>
    </div>
  </div>
  <div class="flex flex-col gap-5">
    <h2 class="font-bold">Price Range</h2>
    <div class="flex flex-col gap-2 px-1">
      <input
        type="range"
        min="0"
        value="85"
        max="200"
        class="bg-transparent [&::-moz-range-thumb]:bg-primary [&::-moz-range-track]:bg-card [&::-webkit-slider-runnable-track]:bg-card [&::-webkit-slider-thumb]:bg-primary [&::-webkit-slider-thumb]:-mt-1 [&::-moz-range-thumb]:rounded-full [&::-moz-range-track]:rounded-full [&::-webkit-slider-runnable-track]:rounded-full [&::-webkit-slider-thumb]:rounded-full w-full [&::-moz-range-thumb]:w-4 [&::-webkit-slider-thumb]:w-4 [&::-moz-range-thumb]:h-4 [&::-moz-range-track]:h-2 [&::-webkit-slider-runnable-track]:h-2 [&::-webkit-slider-thumb]:h-4 appearance-none [&::-webkit-slider-thumb]:appearance-none cursor-pointer"
      />
      <div class="flex justify-between text-text-muted text-xs">
        <span>$0</span>
        <span>$85</span>
        <span>$200+</span>
      </div>
    </div>
  </div>
  <div class="flex flex-col gap-3">
    <h2 class="font-bold">Color</h2>
    <div class="gap-x-6 gap-y-3 grid grid-cols-5 md:grid-cols-4 lg:grid-cols-5">
      <app-color-filter color="bg-black" type="checkbox"></app-color-filter>
      <app-color-filter color="bg-white" type="checkbox"></app-color-filter>
      <app-color-filter color="bg-primary" type="checkbox"></app-color-filter>
      <app-color-filter color="bg-red-500" type="checkbox"></app-color-filter>
      <app-color-filter color="bg-green-700" type="checkbox"></app-color-filter>
      <app-color-filter color="bg-yellow-400" type="checkbox"></app-color-filter>
      <app-color-filter color="bg-gray-500" type="checkbox"></app-color-filter>
    </div>
  </div>
  <div class="flex flex-col gap-3">
    <h2 class="font-bold">Size</h2>
    <div class="grid grid-cols-5 md:grid-cols-3 lg:grid-cols-5 gap-2">
      <app-size-filter size="XS"></app-size-filter>
      <app-size-filter size="S"></app-size-filter>
      <app-size-filter size="M"></app-size-filter>
      <app-size-filter size="L"></app-size-filter>
      <app-size-filter size="XL"></app-size-filter>
      <app-size-filter size="XXL"></app-size-filter>
    </div>
  </div>
  <div
    class="flex flex-col gap-2 bg-linear-to-br from-primary/20 to-transparent p-4 border border-primary/20 rounded-xl"
  >
    <h1 class="flex items-center gap-2 font-bold">
      <fa-icon [icon]="faWandMagicSparkles" class="text-primary"></fa-icon
      ><span>AI Design Studio</span>
    </h1>
    <div class="flex flex-col gap-3">
      <p class="text-text-muted text-xs">Create unique patterns using our generative AI engine.</p>
      <app-button type="primary">Try it now</app-button>
    </div>
  </div>
</ng-template>
<div
  class="gap-9 grid grid-cols-1 md:grid-cols-12 mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-20 max-w-7xl overflow-hidden"
>
  <aside
    class="hidden md:flex flex-col gap-5 md:col-span-3 xl:col-span-2 bg-amber pr-5 border-slate-800 border-r"
  >
    <ng-container *ngTemplateOutlet="filterContent"></ng-container>
  </aside>
  <div class="md:col-span-9 xl:col-span-10">
    <div class="flex flex-col gap-5">
      <div class="flex flex-wrap justify-between items-center gap-5">
        <h1 class="font-bold">
          All Apparel
          <span class="font-normal text-primary text-xs">(124 items)</span>
        </h1>
        <div class="flex items-center gap-3">
          <button
            class="md:hidden flex items-center gap-1 text-text-muted text-xs"
            (click)="filterModal.showModal()"
          >
            <fa-icon [icon]="faFilter"></fa-icon>
            <span>Filters</span>
          </button>
          <select
            class="bg-card py-2 pr-1.5 pl-2 border border-border rounded-lg hover:ring-1 hover:ring-blue-600 text-xs cursor-pointer"
          >
            <option value="" selected>Sort by: Recommended</option>
            <option value="">Price</option>
            <option value="">Latest</option>
          </select>
        </div>
      </div>
      <div
        class="gap-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 2xl:grid-cols-5 xl:grid-cols-4"
      >
        <app-product-card></app-product-card>
        <app-product-card></app-product-card>
        <app-product-card></app-product-card>
      </div>
    </div>
  </div>
</div>
<dialog #filterModal class="modal-bottom modal sm:modal-middle">
  <div class="modal-box">
    <div class="flex justify-between items-center mb-5">
      <h3 class="font-bold text-lg">Filters</h3>
      <form method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost">✕</button>
      </form>
    </div>
    <div class="flex flex-col gap-5 pb-6">
      <ng-container *ngTemplateOutlet="filterContent"></ng-container>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button>Close</button>
  </form>
</dialog>
