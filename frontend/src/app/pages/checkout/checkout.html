<section class="mx-auto px-4 sm:px-6 lg:px-8 pt-32 pb-20 max-w-7xl overflow-hidden">
  <!-- Start Checkout Header -->
  <header class="mb-12">
    <ol class="flex justify-center items-center space-x-2 sm:space-x-8 mx-auto w-full max-w-3xl">
      <li class="flex items-center text-primary">
        <span
          class="flex justify-center items-center bg-primary border-2 border-primary rounded-full w-8 h-8 text-white"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-check-icon lucide-check"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </span>
        <span class="hidden sm:block ml-3 font-medium text-sm">Cart Review</span>
      </li>
      <li class="flex-1 bg-primary/30 h-0.5"></li>
      <li class="flex items-center text-primary">
        <span
          class="flex justify-center items-center bg-primary border-2 border-primary rounded-full w-8 h-8 font-bold text-white text-sm"
        >
          2
        </span>
        <span class="hidden sm:block ml-3 font-bold text-sm">Checkout</span>
      </li>
      <li class="flex-1 bg-slate-700 h-0.5"></li>
      <li class="flex items-center text-slate-500">
        <span
          class="flex justify-center items-center bg-transparent border-2 border-slate-700 rounded-full w-8 h-8 font-medium text-sm"
          >3 </span
        ><span class="hidden sm:block ml-3 font-medium text-sm">Confirmation</span>
      </li>
    </ol>
  </header>
  <!-- End Checkout Header -->
  <div class="lg:gap-x-12 lg:grid lg:grid-cols-12">
    <!-- Left Section -->
    <div class="space-y-10 lg:col-span-7">
      <section>
        <h2 class="flex items-center gap-2 mb-6 font-bold text-white text-xl">
          <span class="text-primary">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-van-icon lucide-van"
            >
              <path
                d="M13 6v5a1 1 0 0 0 1 1h6.102a1 1 0 0 1 .712.298l.898.91a1 1 0 0 1 .288.702V17a1 1 0 0 1-1 1h-3"
              />
              <path d="M5 18H3a1 1 0 0 1-1-1V8a2 2 0 0 1 2-2h12c1.1 0 2.1.8 2.4 1.8l1.176 4.2" />
              <path d="M9 18h5" />
              <circle cx="16" cy="18" r="2" />
              <circle cx="7" cy="18" r="2" />
            </svg>
          </span>
          Shipping Details
        </h2>
        <div class="gap-x-4 gap-y-6 grid grid-cols-1 sm:grid-cols-6">
          <div class="sm:col-span-3">
            <label class="font-medium text-slate-300 text-sm">First name</label>
            <input
              type="text"
              class="bg-card mt-1 p-2.5 border border-slate-600 focus:border-primary rounded-lg outline-none w-full text-white text-sm transition-all duration-300"
            />
          </div>
          <div class="sm:col-span-3">
            <label class="font-medium text-slate-300 text-sm">Last name</label>
            <input
              type="text"
              class="bg-card mt-1 p-2.5 border border-slate-600 focus:border-primary rounded-lg outline-none w-full text-white text-sm transition-all duration-300"
            />
          </div>
          <div class="sm:col-span-6">
            <label class="font-medium text-slate-300 text-sm">Phone</label>
            <input
              type="text"
              class="bg-card mt-1 p-2.5 border border-slate-600 focus:border-primary rounded-lg outline-none w-full text-white text-sm transition-all duration-300"
            />
          </div>
          <div class="sm:col-span-6">
            <label class="font-medium text-slate-300 text-sm">Email</label>
            <input
              type="text"
              class="bg-card mt-1 p-2.5 border border-slate-600 focus:border-primary rounded-lg outline-none w-full text-white text-sm transition-all duration-300"
            />
          </div>
          <div class="sm:col-span-6">
            <label class="font-medium text-slate-300 text-sm">Address</label>
            <input
              type="text"
              class="bg-card mt-1 p-2.5 border border-slate-600 focus:border-primary rounded-lg outline-none w-full text-white text-sm transition-all duration-300"
            />
          </div>
          <div class="sm:col-span-3">
            <label class="font-medium text-slate-300 text-sm">City</label>
            <input
              type="text"
              class="bg-card mt-1 p-2.5 border border-slate-600 focus:border-primary rounded-lg outline-none w-full text-white text-sm transition-all duration-300"
            />
          </div>
          <div class="sm:col-span-3">
            <label class="font-medium text-slate-300 text-sm">ZIP</label>
            <input
              type="text"
              class="bg-card mt-1 p-2.5 border border-slate-600 focus:border-primary rounded-lg outline-none w-full text-white text-sm transition-all duration-300"
            />
          </div>
        </div>
      </section>
      <section>
        <h2 class="flex items-center gap-2 mb-6 font-bold text-white text-xl">
          <span class="text-primary">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-wallet-cards-icon lucide-wallet-cards"
            >
              <rect width="18" height="18" x="3" y="3" rx="2" />
              <path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2" />
              <path
                d="M3 11h3c.8 0 1.6.3 2.1.9l1.1.9c1.6 1.6 4.1 1.6 5.7 0l1.1-.9c.5-.5 1.3-.9 2.1-.9H21"
              />
            </svg>
          </span>
          Payment Method
        </h2>
        <div class="gap-4 grid grid-cols-2 mb-6">
          <label
            for="credit"
            class="flex bg-card shadow-sm p-4 border border-slate-700 has-checked:border-primary rounded-xl cursor-pointer"
          >
            <input id="credit" type="radio" name="payment-method" checked class="hidden" />
            <div class="flex flex-col flex-1">
              <span class="block font-bold text-white text-sm">Credit Card</span>
              <span class="mt-1 text-slate-400 text-sm">Faster checkout</span>
            </div>
          </label>
          <label
            for="cash"
            class="flex bg-card shadow-sm p-4 border border-slate-700 has-checked:border-primary rounded-xl cursor-pointer"
          >
            <input id="cash" type="radio" name="payment-method" class="hidden" />
            <div class="flex flex-col flex-1">
              <span class="block font-medium text-white text-sm">COD</span>
              <span class="mt-1 text-slate-400 text-sm">Cash on Delivery</span>
            </div>
          </label>
        </div>
      </section>
    </div>
    <!-- Right Section -->
    <div class="lg:col-span-5 mt-10 lg:mt-0">
      <div class="bg-card shadow-lg p-6 border border-slate-800 rounded-xl">
        <h2 class="mb-4 font-bold text-white text-lg">Order Summary</h2>
        <div class="flex flex-col space-y-4 mb-4 pr-2 max-h-60 overflow-y-auto">
          <app-checkout-product-card></app-checkout-product-card>
          <app-checkout-product-card></app-checkout-product-card>
          <app-checkout-product-card></app-checkout-product-card>
          <app-checkout-product-card></app-checkout-product-card>
          <app-checkout-product-card></app-checkout-product-card>
          <app-checkout-product-card></app-checkout-product-card>
          <app-checkout-product-card></app-checkout-product-card>
        </div>
        <div class="space-y-2 pt-4 border-slate-700 border-t">
          <div class="flex justify-between text-slate-400 text-sm">
            <span>Subtotal</span>
            <span>$210.00</span>
          </div>
          <div class="flex justify-between text-slate-400 text-sm">
            <span>Shipping</span>
            <span class="text-green-500">Free</span>
          </div>
          <div class="flex justify-between pt-2 font-bold text-white text-base">
            <span>Total</span>
            <span>$210.00</span>
          </div>
        </div>
        <button
          class="bg-primary hover:bg-blue-600 mt-6 py-3 rounded-xl w-full font-bold text-white transition-colors duration-300 cursor-pointer"
        >
          Pay
        </button>
      </div>
    </div>
  </div>
</section>
