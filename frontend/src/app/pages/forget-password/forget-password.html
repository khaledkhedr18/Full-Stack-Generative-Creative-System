<div class="py-12 flex flex-col min-h-screen bg-[#0d1117] text-white">

  <!-- Page Body -->
  <div class="flex flex-1 items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg space-y-8">

      <!-- Hero Image -->
      <div
        class="w-full rounded-2xl overflow-hidden"
        style="height: 210px; background: radial-gradient(ellipse at 60% 40%, #1e3a5f 0%, #0d1117 70%);"
      ></div>

      <!-- Title -->
      <div class="space-y-2">
        <h1 class="text-4xl font-black text-white">Forgot Password</h1>
        <p class="text-slate-400 text-sm leading-relaxed">
          Enter your email address and we'll send you a link to reset your password and get back to
          your AI-curated wardrobe.
        </p>
      </div>

      <!-- Alert Banner -->
      <div
        *ngIf="alertMessage"
        [class]="alertType === 'error'
          ? 'rounded-xl px-4 py-3 text-sm border border-red-500/30 bg-red-500/10 text-red-400'
          : 'rounded-xl px-4 py-3 text-sm border border-green-500/30 bg-green-500/10 text-green-400'"
      >
        {{ alertMessage }}
      </div>

      <!-- Form -->
      <form (ngSubmit)="onSubmit()" #forgotForm="ngForm" class="flex flex-col gap-6" novalidate>

        <!-- Email Field -->
        <div class="flex flex-col gap-2">
          <label class="text-xs font-semibold uppercase tracking-widest text-slate-400">
            Email Address
          </label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-base">✉</span>
            <input
              type="email"
              [(ngModel)]="email"
              name="email"
              required
              email
              #emailRef="ngModel"
              [disabled]="otpSent"
              class="w-full h-14 pl-10 pr-16 rounded-xl border border-white/10 bg-white/5 text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 transition disabled:opacity-50 disabled:cursor-not-allowed"
              placeholder="alex@aura-ai.com"
            />
            <button
              *ngIf="otpSent"
              type="button"
              (click)="editEmail()"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-blue-400 text-xs font-semibold hover:text-blue-300 transition"
            >
              Edit
            </button>
          </div>
          <span *ngIf="emailRef.invalid && emailRef.touched" class="text-red-400 text-xs">
            Please enter a valid email address.
          </span>
        </div>

        <!-- Send OTP Button -->
        <button
          *ngIf="!otpSent"
          type="button"
          (click)="sendOtp()"
          [disabled]="isSendingOtp || emailRef.invalid"
          class="w-full h-14 rounded-xl bg-blue-600 hover:bg-blue-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold transition flex items-center justify-center gap-2"
        >
          <span *ngIf="isSendingOtp" class="animate-spin inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full"></span>
          {{ isSendingOtp ? 'Sending...' : 'Send Verification Code' }}
        </button>

        <!-- OTP Section -->
        <ng-container *ngIf="otpSent">

          <div class="flex flex-col gap-3">
            <div class="flex items-center justify-between">
              <label class="text-xs font-semibold uppercase tracking-widest text-slate-400">
                Enter Verification Code
              </label>
              <span *ngIf="resendTimer > 0" class="text-xs text-slate-500">
                Resend in {{ resendTimer }}s
              </span>
            </div>

            <!-- OTP Boxes — no ngModel, controlled manually -->
            <div class="flex justify-between gap-3">
              <input
                *ngFor="let box of codeArray; let i = index"
                #codeInput
                type="text"
                maxlength="1"
                inputmode="numeric"
                autocomplete="one-time-code"
                [value]="codeArray[i]"
                [class]="'w-12 h-14 text-center text-xl font-bold rounded-xl border outline-none transition focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 ' +
                  (codeArray[i] ? 'border-blue-500 bg-blue-500/10 text-white' : 'border-white/10 bg-white/5 text-white')"
                (input)="onCodeInput($event, i)"
                (keydown)="onKeyDown($event, i)"
                (paste)="onPaste($event)"
              />
            </div>

            <!-- Progress dots -->
            <div class="flex gap-2 justify-center mt-1">
              <span
                *ngFor="let box of codeArray; let i = index"
                [class]="'w-2 h-2 rounded-full transition-all duration-300 ' + (codeArray[i] ? 'bg-blue-500' : 'bg-white/10')"
              ></span>
            </div>
          </div>

          <!-- Resend -->
          <button
            type="button"
            (click)="resendCode()"
            [disabled]="resendTimer > 0 || isResending"
            class="text-blue-400 text-sm font-semibold text-left hover:text-blue-300 transition disabled:opacity-40 disabled:cursor-not-allowed w-fit"
          >
            {{ isResending ? 'Sending...' : 'Resend Code' }}
          </button>

          <!-- Verify Submit -->
          <button
            type="submit"
            [disabled]="isVerifying || codeArray.join('').length < 6"
            class="w-full h-14 rounded-xl bg-blue-600 hover:bg-blue-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold transition flex items-center justify-center gap-2"
          >
            <span *ngIf="isVerifying" class="animate-spin inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full"></span>
            {{ isVerifying ? 'Verifying...' : 'Verify & Reset Password' }}
            <span *ngIf="!isVerifying">→</span>
          </button>

        </ng-container>

      </form>

      <!-- Back to Login -->
      <div class="text-center">
        <a routerLink="/login" class="inline-flex items-center gap-2 text-blue-400 text-sm font-semibold hover:text-blue-300 transition">
          ← Back to Login
        </a>
      </div>
    </div>
  </div>
</div>
