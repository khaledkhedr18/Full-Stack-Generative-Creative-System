<div class="flex justify-center items-center p-10 xl:h-full xl:p-0">
  <div class="flex lg:w-5xl">
    <div
      class="w-1/2 signup-hero rounded-l-2xl md:flex flex-col justify-end p-5 lg:p-12 gap-4 hidden"
    >
      <div class="flex items-center gap-1.5">
        <div class="bg-primary w-fit p-1.5 rounded-md">

            />
          </svg>
        </div>
        <h1 class="font-semibold">AI Fashion Studio</h1>
      </div>
      <div>
        <p class="font-bold text-4xl w-72">Redefining style with artificial intelligence.</p>
      </div>
      <p class="text-text-muted w-80">
        Join thousands of designers and creators generating custom, sustainable fashion pieces in
        seconds.
      </p>
    </div>
    <div
      class="md:w-1/2 rounded-2xl flex justify-center bg-card p-5 md:py-16 md:rounded-l-none md:rounded-r-2xl"
    >
      <div class="flex flex-col gap-7">
        <div class="flex flex-col gap-1">
          <h2 class="font-semibold text-2xl">Create an account</h2>
          <p class="text-text-muted text-sm">Start designing your future wardrobe today.</p>
        </div>
        <div class="flex items-center gap-3">
          <app-button type="secondary">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 48 48"
              style="width: 16px; height: 16px"
            >
              <path
                fill="#EA4335"
                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
              />
              <path
                fill="#4285F4"
                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
              />
              <path
                fill="#FBBC05"
                d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.97-6.19z"
              />
              <path
                fill="#34A853"
                d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
              />
              <path fill="none" d="M0 0h48v48H0z" />
            </svg>
            <span>Google</span>
          </app-button>
          <app-button type="secondary">
            <fa-icon [icon]="faFacebook" class="text-primary" [size]="'xl'"></fa-icon>
            <span>Facebook</span>
          </app-button>
        </div>
        <app-divider label="Or sign up with email"></app-divider>
        <form action="" class="flex flex-col gap-5">
          <app-form-input
            inputId="name"
            label="Full Name"
            [icon]="faUser"
            type="text"
            placeholder="John Doe"
          ></app-form-input>
          <app-form-input
            inputId="email"
            label="Email Address"
            [icon]="faEnvelope"
            type="email"
            placeholder="john@example.com"
          ></app-form-input>
          <app-form-input
            inputId="password"
            label="Password"
            [icon]="faLock"
            type="password"
            placeholder="••••••••"
            parent="signup"
          ></app-form-input>
          <app-button type="primary">Create Account</app-button>
        </form>
        <p class="text-xs text-text-muted self-center">
          Already have an account?
          <a routerLink="/login" class="text-primary font-semibold">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
